name: Post a Reel
run-name: "Post Reel ${{ inputs.reel }} of run ${{ inputs.source_run }}"
# Posts one finished Reel (from a Make a Reel run) to Instagram and YouTube Shorts, whichever is set up, and
# sends the links to Telegram. Started by the bot's ✅ Post button. A receipt artifact per Reel makes sure the
# same Reel is never posted twice, even if the button is tapped again.
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Make a Reel run ID
        required: true
        type: string
      reel:
        description: Which Reel of that run (1, 2, ...)
        required: true
        default: '1'
        type: string
      platforms:
        description: Only these (instagram,youtube); empty = all that are set up
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-${{ inputs.source_run }}-${{ inputs.reel }}
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Download the Reel
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
          REEL: ${{ inputs.reel }}
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ && "$REEL" =~ ^[0-9]+$ ]] || { echo 'Run ID and Reel number must be numbers'; exit 1; }
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "reel-$SOURCE_RUN" --dir src
          # An earlier post of this Reel left its receipt as an artifact: carry it over so nothing is posted twice.
          if gh run list --repo "$GITHUB_REPOSITORY" --workflow publish.yml --status completed --limit 50 --json databaseId,displayTitle \
               --jq ".[] | select(.displayTitle == \"Post Reel $REEL of run $SOURCE_RUN\") | .databaseId" > earlier.txt && [ -s earlier.txt ]; then
            for id in $(cat earlier.txt); do gh run download "$id" --repo "$GITHUB_REPOSITORY" --name "posted-$SOURCE_RUN-$REEL" --dir "src/out/$REEL" 2>/dev/null && break; done
          fi
          ls "src/out/$REEL"
      - name: Post
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REEL: ${{ inputs.reel }}
          PLATFORMS: ${{ inputs.platforms }}
        run: python -m reel publish "src/out/$REEL" "src/remotion/out/reel-$REEL.mp4" --platforms "$PLATFORMS"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: posted-${{ inputs.source_run }}-${{ inputs.reel }}
          path: src/out/${{ inputs.reel }}/publish.json
          if-no-files-found: ignore
          retention-days: 90
