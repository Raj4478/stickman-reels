name: Make a Reel
run-name: "Stickman Reel: ${{ inputs.topic || (inputs.remake_of && format('again {0}', inputs.remake_of)) || (github.event_name == 'schedule' && 'daily') || 'random topic' }}${{ inputs.series && ' (2-part series)' || '' }}"
# Writes Hindi life-lesson stories with Gemini (free tier: a writer pass, then a director pass for hooks and
# camera shots), records the narration, times every word with Whisper, renders the stick-figure Reels with
# Remotion and sends each video and its cover to Telegram for review. Nothing is posted to Instagram yet.
on:
  workflow_dispatch:
    inputs:
      topic:
        description: Life lesson (leave empty for a fresh random line of topics.txt)
        required: false
        type: string
      count:
        description: How many Reels (different topics)
        required: false
        type: choice
        options: ['1', '2', '3', '5']
        default: '1'
      series:
        description: Two-part story instead (part 1 ends on a cliffhanger)
        required: false
        type: boolean
        default: false
      remake_of:
        description: 'Make again: "<run id>:<reel>" of an earlier Reel (same lesson, new story)'
        required: false
        type: string
      sample:
        description: Render examples/sample.json without Gemini (to test the template)
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '30 3 * * *'   # 09:00 IST; runs only when the DAILY_REEL repository variable is "true"
permissions:
  contents: read
  actions: read
concurrency:
  group: make-reel
  cancel-in-progress: false
jobs:
  reel:
    if: github.event_name != 'schedule' || vars.DAILY_REEL == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: remotion/package-lock.json
      - name: Cache the Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: Restore the topic history
        uses: actions/cache/restore@v4
        with:
          path: history.json
          key: reel-history-${{ github.run_id }}
          restore-keys: reel-history-
      - name: Install
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq ffmpeg; }
          pip install -q -r requirements.txt
          cd remotion && npm ci
      - name: Write the stories and record the narration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
          REEL_VOICE: ${{ vars.REEL_VOICE }}
          REEL_HANDLE: ${{ vars.REEL_HANDLE }}
          TOPIC: ${{ inputs.topic }}
          COUNT: ${{ inputs.count || '1' }}
          SERIES: ${{ inputs.series }}
          SAMPLE: ${{ inputs.sample }}
          REMAKE_OF: ${{ inputs.remake_of }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$REMAKE_OF" ]; then
            [[ "$REMAKE_OF" =~ ^[0-9]+:[0-9]+$ ]] || { echo 'remake_of must look like 123456:1'; exit 1; }
            gh run download "${REMAKE_OF%%:*}" --repo "$GITHUB_REPOSITORY" --name "reel-${REMAKE_OF%%:*}" --dir earlier
            TOPIC=$(python -m reel topic "earlier/out/${REMAKE_OF##*:}")
            echo "Making again: $TOPIC"
          fi
          if [ "$SAMPLE" = "true" ]; then
            python -m reel make --sample examples/sample.json
          elif [ "$SERIES" = "true" ]; then
            python -m reel make --series --topic "$TOPIC"
          else
            python -m reel make --count "$COUNT" --topic "$TOPIC"
          fi
          for n in $(cat out/reels.txt); do echo "::group::Reel $n script"; cat "out/$n/script.json"; echo "::endgroup::"; done
      - name: Save the topic history
        if: always() && hashFiles('history.json') != ''
        uses: actions/cache/save@v4
        with:
          path: history.json
          key: reel-history-${{ github.run_id }}
      - name: Render with Remotion
        working-directory: remotion
        run: |
          for n in $(cat ../out/reels.txt); do
            npx remotion render src/index.ts StickReel "out/reel-$n.mp4" --props="public/reels/$n/props.json" --crf=23
            npx remotion still src/index.ts StickReel "../out/$n/cover.jpg" --props="public/reels/$n/props.json" --frame=20 --image-format=jpeg
          done
      - name: Send them to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUTO_POST: ${{ vars.AUTO_POST }}
        run: |
          for n in $(cat out/reels.txt); do
            python -m reel send "out/$n" "remotion/out/reel-$n.mp4" --cover "out/$n/cover.jpg"
          done
      # With the AUTO_POST variable set to "true" the Reels are posted straight away (no ✅ Post tap needed).
      - name: Post them (AUTO_POST)
        if: vars.AUTO_POST == 'true' && inputs.sample != true
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          status=0
          for n in $(cat out/reels.txt); do
            python -m reel publish "out/$n" "remotion/out/reel-$n.mp4" || status=1
          done
          exit $status
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reel-${{ github.run_id }}
          path: |
            remotion/out/reel-*.mp4
            out/
          if-no-files-found: warn
          retention-days: 30
