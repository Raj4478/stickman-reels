name: Make a Reel
run-name: "Stickman Reel: ${{ inputs.topic || (inputs.remake_of && format('again {0}', inputs.remake_of)) || (github.event_name == 'schedule' && 'daily') || 'random topic' }}${{ inputs.series && ' (2-part series)' || '' }}${{ contains(inputs.options, 'style=comic') && ' (comic)' || '' }}"
# Writes Hindi life-lesson stories with Gemini (free tier: a writer pass, then a director pass for hooks and
# camera shots), records the narration, times every word with Whisper, renders the stick-figure Reels with
# Remotion and sends each video and its cover to Telegram for review. With options "style=comic" (or the
# REEL_STYLE variable set to comic) it makes a comic Reel instead: a cartoon kid's deadpan rant (reel/comic.py).
on:
  workflow_dispatch:
    inputs:
      topic:
        description: Life lesson (leave empty for a fresh random line of topics.txt)
        required: false
        type: string
      count:
        description: How many Reels (different topics)
        required: false
        type: choice
        options: ['1', '2', '3', '5']
        default: '1'
      series:
        description: Two-part story instead (part 1 ends on a cliffhanger)
        required: false
        type: boolean
        default: false
      remake_of:
        description: 'Make again: "<run id>:<reel>" of an earlier Reel (same lesson, new story)'
        required: false
        type: string
      idea_of:
        description: 'An idea from the weekly ideas: "<run id>:<index>"'
        required: false
        type: string
      options:
        description: 'Choices from the bot, e.g. "theme=money voice=female music=off source=ideas style=comic"'
        required: false
        type: string
      sample:
        description: Render examples/sample.json (or examples/comic.json with style=comic) without Gemini
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '30 3 * * *'   # 09:00 IST; runs only when the DAILY_REEL repository variable is "true"
permissions:
  contents: read
  actions: read
# Only the daily run shares a group (so two never overlap). Every request from the bot gets its own group: GitHub
# keeps just one pending run per group and cancels the rest, which silently dropped taps made close together.
concurrency:
  group: make-reel-${{ github.event_name == 'schedule' && 'daily' || github.run_id }}
  cancel-in-progress: false
jobs:
  reel:
    if: github.event_name != 'schedule' || vars.DAILY_REEL == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: remotion/package-lock.json
      - name: Cache the Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: Restore the topic history
        uses: actions/cache/restore@v4
        with:
          path: |
            history.json
            ideas.json
          key: reel-history-${{ github.run_id }}
          restore-keys: reel-history-
      - name: Install
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq ffmpeg; }
          pip install -q -r requirements.txt
          cd remotion && npm ci
      - name: Write the stories and record the narration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
          REEL_VOICE: ${{ vars.REEL_VOICE }}
          REEL_HANDLE: ${{ vars.REEL_HANDLE }}
          TOPIC: ${{ inputs.topic }}
          COUNT: ${{ inputs.count || '1' }}
          SERIES: ${{ inputs.series }}
          SAMPLE: ${{ inputs.sample }}
          REMAKE_OF: ${{ inputs.remake_of }}
          IDEA_OF: ${{ inputs.idea_of }}
          OCCASIONS: ${{ vars.OCCASIONS }}
          LOVE_SHARE: ${{ vars.LOVE_SHARE }}
          REEL_STYLE: ${{ vars.REEL_STYLE }}
          REEL_INK: ${{ vars.REEL_INK }}
          REEL_AUDIENCE: ${{ vars.REEL_AUDIENCE }}
          COMIC_DRAFTS: ${{ vars.COMIC_DRAFTS }}
          KID_NAME: ${{ vars.KID_NAME }}
          KID_NAME_GIRL: ${{ vars.KID_NAME_GIRL }}
          KID_CATCHPHRASE: ${{ vars.KID_CATCHPHRASE }}
          OPTIONS: ${{ inputs.options }}
          HOOK_TEST: ${{ vars.HOOK_TEST }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$REMAKE_OF" ]; then
            [[ "$REMAKE_OF" =~ ^[0-9]+:[0-9]+$ ]] || { echo 'remake_of must look like 123456:1'; exit 1; }
            gh run download "${REMAKE_OF%%:*}" --repo "$GITHUB_REPOSITORY" --name "reel-${REMAKE_OF%%:*}" --dir earlier
            TOPIC=$(python -m reel topic "earlier/out/${REMAKE_OF##*:}")
            OPTIONS="$OPTIONS style=$(python -m reel topic --style "earlier/out/${REMAKE_OF##*:}")"  # same style again
            echo "Making again: $TOPIC"
          fi
          if [ -n "$IDEA_OF" ]; then
            [[ "$IDEA_OF" =~ ^[0-9]+:[0-9]+$ ]] || { echo 'idea_of must look like 123456:0'; exit 1; }
            gh run download "${IDEA_OF%%:*}" --repo "$GITHUB_REPOSITORY" --name "ideas-${IDEA_OF%%:*}" --dir earlier-ideas
            TOPIC=$(python -c "import json,sys; print(json.load(open('earlier-ideas/ideas.json', encoding='utf-8'))['ideas'][int(sys.argv[1])]['topic'])" "${IDEA_OF##*:}")
            echo "Making idea: $TOPIC"
          fi
          if [ "$SAMPLE" = "true" ]; then
            case " $OPTIONS " in *" style=comic "*) SAMPLE_FILE=examples/comic.json ;; *) SAMPLE_FILE=examples/sample.json ;; esac
            python -m reel make --sample "$SAMPLE_FILE"
          elif [ "$SERIES" = "true" ]; then
            python -m reel make --series --topic "$TOPIC" --options "$OPTIONS"
          else
            python -m reel make --count "$COUNT" --topic "$TOPIC" --options "$OPTIONS"
          fi
          for n in $(cat out/reels.txt); do echo "::group::Reel $n script"; cat "out/$n/script.json"; echo "::endgroup::"; done
      - name: Save the topic history
        if: always() && hashFiles('history.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            history.json
            ideas.json
          key: reel-history-${{ github.run_id }}
      - name: Render with Remotion
        working-directory: remotion
        run: |
          # The master: a gentle colour grade (lifted darks, a soft S-curve, a little saturation) and loudness
          # normalised to -14 LUFS (where Instagram and YouTube normalise), then the one final CRF 18 encode
          master() {
            ffmpeg -v error -y -i "$1" \
              -vf "curves=all='0/0.03 0.28/0.30 0.6/0.63 1/1',eq=saturation=1.06" \
              -af "loudnorm=I=-14:TP=-1.5:LRA=7" \
              -c:v libx264 -crf 18 -preset slow -pix_fmt yuv420p -c:a aac -b:a 192k -ar 48000 -movflags +faststart "$1.m.mp4" \
              && mv "$1.m.mp4" "$1"
          }
          for n in $(cat ../out/reels.txt); do
            t0=$(date +%s)
            # CRF 14: a near-lossless intermediate, so the video is compressed only once at a lossy setting
            npx remotion render src/index.ts StickReel "out/reel-$n.mp4" --props="public/reels/$n/props.json" --crf=14
            master "out/reel-$n.mp4"
            echo "::notice::Reel $n rendered and mastered in $(( $(date +%s) - t0 ))s"
            if grep -q '"style": "comic"' "public/reels/$n/props.json"; then
              npx remotion still src/index.ts ComicCover "../out/$n/cover.jpg" --props="public/reels/$n/props.json" --image-format=jpeg --jpeg-quality=92
            else
              npx remotion still src/index.ts StickReel "../out/$n/cover.jpg" --props="public/reels/$n/props.json" --frame=20 --image-format=jpeg
            fi
            # HOOK_TEST: the same Reel with the second on-screen hook, posted as an Instagram trial Reel
            if [ -f "public/reels/$n/props-b.json" ]; then
              npx remotion render src/index.ts StickReel "out/reel-$n-b.mp4" --props="public/reels/$n/props-b.json" --crf=14
              master "out/reel-$n-b.mp4"
            fi
          done
          # carousel slides (5 portrait images) for each Reel
          cd .. && for n in $(cat out/reels.txt); do python -m reel slides "out/$n" "remotion/out/reel-$n.mp4"; done
      - name: Quality check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        run: |
          for n in $(cat out/reels.txt); do python -m reel check "out/$n" "remotion/out/reel-$n.mp4" || true; done
      - name: Send them to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUTO_POST: ${{ vars.AUTO_POST }}
        run: |
          for n in $(cat out/reels.txt); do
            python -m reel send "out/$n" "remotion/out/reel-$n.mp4" --cover "out/$n/cover.jpg"
          done
      # With the AUTO_POST variable set to "true" the Reels are posted straight away (no ✅ Post tap needed).
      - name: Post them (AUTO_POST)
        if: vars.AUTO_POST == 'true' && inputs.sample != true
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CAROUSEL: ${{ vars.CAROUSEL }}
          HOOK_TEST: ${{ vars.HOOK_TEST }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # AUTO_POST posts at once (the best-time queue needs the Post button's workflow)
          status=0
          for n in $(cat out/reels.txt); do
            extra=(); [ -f "remotion/out/reel-$n-b.mp4" ] && extra+=(--video-b "remotion/out/reel-$n-b.mp4")
            python -m reel publish "out/$n" "remotion/out/reel-$n.mp4" --now "${extra[@]}" || status=1
          done
          exit $status
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reel-${{ github.run_id }}
          path: |
            remotion/out/reel-*.mp4
            out/
          if-no-files-found: warn
          retention-days: 30
