name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: remotion/package-lock.json
      - name: Python tests
        run: |
          pip install -q numpy
          python -m unittest discover -s tests -t . -v
      - name: Type-check the template
        working-directory: remotion
        run: |
          npm ci
          npm run check
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - name: Bot tests
        working-directory: bot
        run: |
          npm ci
          npm test
  stills:
    # a look-book of comic frames with the Instagram safe zones drawn in red, so every PR shows how frames look
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: remotion/package-lock.json
      - name: Render a look-book (with safe-zone guides)
        working-directory: remotion
        run: |
          npm ci
          for f in 15 140 260 380 500 600; do
            npx remotion still src/index.ts ComicReel "out/look-$f.jpg" --frame=$f --props='{"guides":true}' --scale=0.5 --image-format=jpeg
          done
          npx remotion still src/index.ts ComicCover out/look-cover.jpg --scale=0.5 --image-format=jpeg
      - name: The 3D engine renders, and renders the same frame twice
        working-directory: remotion
        run: |
          npx remotion still src/index.ts ComicReel out/look-3d.jpg --frame=140 --props='{"engine":"three","guides":true}' --scale=0.5 --image-format=jpeg --gl=swangle
          npx remotion still src/index.ts ComicReel out/a.png --frame=140 --props='{"engine":"three"}' --gl=swangle
          npx remotion still src/index.ts ComicReel out/b.png --frame=140 --props='{"engine":"three"}' --gl=swangle
          cmp out/a.png out/b.png
      - uses: actions/upload-artifact@v7
        with:
          name: lookbook
          path: remotion/out/look-*.jpg
